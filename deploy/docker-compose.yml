services:
  # Using pgvector's official image with PostgreSQL 16 for vector search capabilities
  # You may want to use an existing PostgreSQL service, but ensure it has the pgvector
  # extension available: init-databases.sh installs `vector` into the errand
  # database, which is where Hindsight keeps its vectors (in a `hindsight`
  # schema alongside errand's own `public` tables).
  #
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: errand
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - errand-net

# Using Valkey as a Pub/Sub service. Valkey is a Redis-compatible nosql database
# that provides high performance and scalability.
  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - errand-net

# LiteLLM is a LLM proxy that provides a consistent API for interacting with different
# LLM providers. You can configure it to use any LLM provider supported by LiteLLM, such
# as OpenAI, Anthropic, or Azure OpenAI, by setting the appropriate environment variables
#  and configuration file, or through the UI.
  litellm:
    image: ghcr.io/berriai/litellm:v1.83.14-stable
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/litellm
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: --config /app/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    networks:
      - errand-net

# Hindsight is the agent-memory service: it stores and searches what tasks learn.
# This is errand's own build of it — upstream's slim API image plus the two
# packages the local ONNX embedding path needs, with the embedding and reranker
# models baked in, so first run needs no model download. See Dockerfile.hindsight.
#
# It shares errand's PostgreSQL database and keeps its tables in a `hindsight`
# schema; alembic owns `public` and never touches the other (enforced by
# errand/tests/test_alembic_schema_boundary.py).
  hindsight-init:
    image: ghcr.io/errand-ai/errand-hindsight:latest
    user: root
    volumes:
      - hindsight-models:/home/hindsight/.cache
    # Docker creates an empty named volume owned by root when the image has no
    # directory at the mount point, and Hindsight runs as uid 1000 — so without
    # this, first run dies on `PermissionError: /home/hindsight/.cache/huggingface`.
    command: chown -R hindsight:hindsight /home/hindsight/.cache
    networks:
      - errand-net

  hindsight:
    image: ghcr.io/errand-ai/errand-hindsight:latest
    ports:
      - "8888:8888"
    environment:
      # Same database as errand, different schema.
      HINDSIGHT_API_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/errand
      HINDSIGHT_API_DATABASE_SCHEMA: hindsight
      # Without a tenant extension the API and the MCP endpoint are both open to
      # anything that can reach the container. This is the built-in API-key
      # extension: it authenticates every endpoint except /health, so the
      # healthcheck below still works unauthenticated.
      #
      # The same value goes to the errand server as HINDSIGHT_TOKEN, which sends
      # it as the Authorization header on the memory MCP entry. Change it here
      # and it changes in both places; set HINDSIGHT_TOKEN in .env to override.
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_TOKEN:-errand-hindsight-changeme}
      # Hindsight claims work under a worker id and expects it to be stable
      # across restarts; the default is the container hostname, which changes on
      # every recreate and can leave claimed operations stuck. Pin it to the
      # service name, as upstream's own start-up warning recommends.
      HINDSIGHT_API_WORKER_ID: hindsight
      HINDSIGHT_API_LLM_BASE_URL: ${OPENAI_BASE_URL:-http://litellm:4000}
      HINDSIGHT_API_LLM_API_KEY: ${OPENAI_API_KEY:-${LITELLM_MASTER_KEY:-sk-1234}}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-gemini-2.5-flash}
    volumes:
      - hindsight-models:/home/hindsight/.cache
    depends_on:
      postgres:
        condition: service_healthy
      hindsight-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - errand-net

# The Hindsight Control Plane: graph exploration, per-memory editing, directives,
# webhooks. An expert debugging tool, not part of the everyday product, so it is
# off by default and publishes no port — start it with
# `docker compose --profile memory-ui up`.
  hindsight-control-plane:
    profiles: ["memory-ui"]
    image: ghcr.io/vectorize-io/hindsight-control-plane:0.9.2
    ports:
      - "9999:9999"
    environment:
      HINDSIGHT_CP_DATAPLANE_API_URL: http://hindsight:8888
      # Enabling the tenant extension closes the REST API too, not only /mcp, so
      # the Control Plane is a client that has to authenticate like any other.
      HINDSIGHT_CP_DATAPLANE_API_KEY: ${HINDSIGHT_TOKEN:-errand-hindsight-changeme}
      # Its own login. Defaulted to the same value rather than left unset,
      # because unset means no login at all on a UI with full read/write access
      # to every memory.
      HINDSIGHT_CP_ACCESS_KEY: ${HINDSIGHT_CP_ACCESS_KEY:-${HINDSIGHT_TOKEN:-errand-hindsight-changeme}}
    depends_on:
      hindsight:
        condition: service_healthy
    networks:
      - errand-net

# The migrate service runs database migrations using Alembic to ensure the database
# schema is up to date before starting the main application. It depends on the
# PostgreSQL service being healthy before it runs, and the errand service depends
# on it completing successfully before it starts.
  migrate:
    image: ghcr.io/errand-ai/errand:latest
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/errand
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - errand-net

# The errand service is the main application that provides the API and UI for
# interacting with the Errand agent.
  errand:
    image: ghcr.io/errand-ai/errand:latest
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/errand
      VALKEY_URL: redis://valkey:6379
      CONTAINER_RUNTIME: docker
      TASK_RUNNER_IMAGE: ghcr.io/errand-ai/errand-task-runner:latest
      TASK_RUNNER_NETWORK: errand-net
      ERRAND_MCP_URL: http://errand:8000/mcp/
      HINDSIGHT_URL: http://hindsight:8888
      # Must match HINDSIGHT_API_TENANT_API_KEY on the hindsight service, or
      # every memory call comes back 401.
      HINDSIGHT_TOKEN: ${HINDSIGHT_TOKEN:-errand-hindsight-changeme}
      PLAYWRIGHT_MCP_URL: http://playwright:3000/mcp
      LLM_PROVIDER_0_NAME: ${LLM_PROVIDER_0_NAME:-litellm}
      LLM_PROVIDER_0_BASE_URL: ${LLM_PROVIDER_0_BASE_URL:-http://litellm:4000}
      LLM_PROVIDER_0_API_KEY: ${LLM_PROVIDER_0_API_KEY:-${LITELLM_MASTER_KEY:-sk-1234}}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      TWITTER_API_KEY: ${TWITTER_API_KEY:-}
      TWITTER_API_SECRET: ${TWITTER_API_SECRET:-}
      TWITTER_ACCESS_TOKEN: ${TWITTER_ACCESS_TOKEN:-}
      TWITTER_ACCESS_SECRET: ${TWITTER_ACCESS_SECRET:-}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      MAX_TURNS: "200"
      ONEDRIVE_MCP_URL: http://onedrive-mcp:8080/mcp
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      - errand-net

# The OneDrive MCP server is a microservice that provides an interface for
# interacting with the Microsoft OneDrive API. It is used in Errand to allow agents to
# read and write files in OneDrive as part of their tasks and actions.
  onedrive-mcp:
    image: ghcr.io/devops-consultants/one-drive-mcp-server:latest
    ports:
      - "8082:8080"
    networks:
      - errand-net

  playwright:
    image: mcr.microsoft.com/playwright/mcp:latest
    entrypoint: ["sh", "-c"]
    command:
      - >-
        Xvfb :99 -screen 0 1920x1080x24 -ac -nolisten tcp &
        sleep 1 &&
        DISPLAY=:99 exec node /app/cli.js --browser chromium --no-sandbox
        --isolated --port 3000 --host 0.0.0.0 --allowed-hosts '*'
    shm_size: '2gb'
    ports:
      - "3000:3000"
    networks:
      - errand-net

volumes:
  postgres-data:
  hindsight-models:

networks:
  errand-net:
    name: errand-net
