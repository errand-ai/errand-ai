name: Claude Code Review

# A stand-in for Copilot review when its budget is exhausted.
#
# IT SKIPS ON PRs THAT CHANGE THIS FILE — INCLUDING THE PR THAT ADDED IT.
# The action refuses to run unless this file is byte-identical to the copy on
# the default branch, and exits *cleanly* when it isn't. So the check goes GREEN
# while reviewing nothing:
#
#   Skipping action due to workflow validation: The workflow file must exist and
#   have identical content to the version on the repository's default branch.
#
# That is a security control, not a bug: if a PR could alter the review workflow
# and have it run, anyone could rewrite it to exfiltrate CLAUDE_CODE_OAUTH_TOKEN.
# Don't try to "fix" it, and don't read a green tick on a workflow-editing PR as
# evidence the review works — check for a posted comment instead.
#
# Prerequisites, both of which fail in their own distinctive way:
#   * CLAUDE_CODE_OAUTH_TOKEN repo secret (`claude setup-token` → `gh secret set`).
#     Missing → the action runs with an empty token and fails.
#   * The Claude Code GitHub App installed on this repo (github.com/apps/claude).
#     The OAuth token authenticates to Anthropic; the action then exchanges it for
#     a GitHub App installation token to read the PR and post the review. Missing →
#     "App token exchange failed: 401 … Claude Code is not installed on this
#     repository". (Passing `github_token: ${{ secrets.GITHUB_TOKEN }}` avoids the
#     app entirely — deliberately not done, to match the getbookable setup.)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Deliberately NO paths-ignore, unlike build.yml. This repo is spec-driven,
    # so a PR that only touches openspec/ or CLAUDE.md is still worth reviewing —
    # arguably more so, since nothing else validates intent against the specs.

# A busy PR fires `synchronize` on every push. Without this, three quick pushes
# queue three full reviews of which only the last is interesting. Cancel the
# superseded ones — this is the main cost control in the workflow.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts are still being written; `ready_for_review` above picks them up the
    # moment they're marked ready, so nothing is missed by skipping them here.
    #
    # The fork check is not a policy choice: on a `pull_request` event from a
    # fork GitHub withholds secrets, so CLAUDE_CODE_OAUTH_TOKEN would be empty
    # and the job would fail with a confusing red X rather than skipping. (Using
    # `pull_request_target` to get around that would run untrusted PR code with
    # write permissions — don't.)
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: errand-ai-runner
    permissions:
      contents: read
      pull-requests: write # the code-review plugin posts its review via `gh pr comment`
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ARC's default runner image (ghcr.io/actions/actions-runner) ships git, curl
      # and jq but NOT gh — unlike ubuntu-latest, which does. Moving this workflow
      # to errand-ai-runner in f2f968e therefore silently broke the review: the
      # code-review plugin does everything through `gh` (read the PR, post the
      # comment), so the job kept going green while posting nothing. Idempotent,
      # so a future image that bundles gh costs one `command -v`.
      - name: Install GitHub CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            echo "gh already installed: $(gh --version | head -1)"
            exit 0
          fi
          # https://github.com/cli/cli/blob/trunk/docs/install_linux.md
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq gh
          gh --version | head -1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Renovate opens PRs as a Bot actor, which the action refuses unless the
          # bot is listed here — every Renovate PR failed with "Workflow initiated
          # by non-human actor". Named explicitly rather than '*', which would let
          # any external GitHub App invoke the action. The job's `if:` already
          # limits this to non-draft PRs from this repository, so widening the
          # actor check does not open it to forks.
          allowed_bots: 'renovate[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `--comment` is load-bearing: without it the plugin's own instructions say
          # "stop here, do not post any GitHub comments", and a free-text "always post"
          # only sometimes overrides that. With it, a clean PR gets the plugin's
          # "No issues found" comment.
          # The plugin also skips PRs it judges automated, so Renovate PRs would be
          # dropped despite allowed_bots above — hence the explicit instruction.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment — Review automated PRs, including Renovate dependency updates, like any other PR; do not skip them for being automated. Always post a PR comment, including the "No issues found" note when nothing is worth flagging.'
          # Agent mode injects no default tool allowlist, so headless Claude denies every
          # Bash call. The plugin needs `gh` (read PR + post the review comment) and `git`
          # (blame/history). Without this the review runs but silently posts nothing.
          # claude-code-action only installs the github_inline_comment MCP server when
          # its tool is named here, and the plugin posts findings inline through it — so
          # without it a review that finds problems has nowhere to put them.
          claude_args: |
            --allowedTools "Bash(gh:*),Bash(git:*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
