name: Build and Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CLAUDE.md'
      - 'openspec/**'
      - '.claude/**'
      - '.serena/**'
  pull_request:
    paths-ignore:
      - 'CLAUDE.md'
      - 'openspec/**'
      - '.claude/**'
      - '.serena/**'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # `github.run_number` increments monotonically for every run of this
          # workflow in the repo. We append it as an extra dot-separated SemVer
          # *pre-release* identifier — e.g. `0.134.2-pr213.42`, where the whole
          # `pr213.42` after the `-` is the pre-release segment. Pre-release
          # identifiers (unlike build metadata after a `+`, which is ignored)
          # participate in SemVer precedence, so a higher run number sorts higher
          # and ArgoCD's Helm comparator treats each PR push as a newer version to
          # redeploy — without bumping the VERSION file on every push.
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ "$EVENT_NAME" = "pull_request" ]; then
            TAG="${VERSION}-pr${PR_NUMBER}.${RUN_NUMBER}"
          else
            TAG="${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check immutable version (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          for IMAGE in "ghcr.io/${{ github.repository_owner }}/errand" "ghcr.io/${{ github.repository_owner }}/errand-task-runner" "ghcr.io/${{ github.repository_owner }}/errand-workspace-gateway" "ghcr.io/${{ github.repository_owner }}/errand-workspace-refresher"; do
            if docker manifest inspect "${IMAGE}:${TAG}" > /dev/null 2>&1; then
              echo "::error::Image tag ${TAG} already exists for ${IMAGE}. Bump the VERSION file."
              exit 1
            fi
          done

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run application tests
        working-directory: errand
        env:
          DATABASE_URL: "sqlite+aiosqlite://"
          PYTHONPATH: "."
        run: |
          pip install -r requirements.txt -r requirements-test.txt -q
          pytest tests/ -v

      - name: Run workspace-gateway tests
        working-directory: workspace-gateway
        run: |
          pip install -r requirements-test.txt -q
          pytest tests/ -v

      - name: Run eval driver tests
        working-directory: evals
        run: |
          pip install -r requirements-test.txt -q
          pytest tests/ -v

      - name: Run task-runner tool-registry tests
        working-directory: task-runner
        run: |
          pip install "pytest==9.1.1" -q
          pytest test_tool_registry.py test_excluded_catalog_tools.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          registry-url: 'https://npm.pkg.github.com'

      - name: Run frontend tests
        working-directory: frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm test

  build-errand:
    needs: [version, test]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push errand image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/errand:${{ needs.version.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/errand:latest', github.repository_owner) || '' }}
          build-args: APP_VERSION=${{ needs.version.outputs.tag }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

  build-task-runner:
    needs: [version, test]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push task runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./task-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/errand-task-runner:${{ needs.version.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/errand-task-runner:latest', github.repository_owner) || '' }}

  build-workspace-gateway:
    needs: [version, test]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push workspace gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./workspace-gateway
          file: ./workspace-gateway/Dockerfile.gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/errand-workspace-gateway:${{ needs.version.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/errand-workspace-gateway:latest', github.repository_owner) || '' }}

  build-workspace-refresher:
    needs: [version, test]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push workspace refresher image
        uses: docker/build-push-action@v7
        with:
          context: ./workspace-gateway
          file: ./workspace-gateway/Dockerfile.refresher
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/errand-workspace-refresher:${{ needs.version.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/errand-workspace-refresher:latest', github.repository_owner) || '' }}

  helm:
    needs: [version, build-errand, build-task-runner, build-workspace-gateway, build-workspace-refresher]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push Helm chart
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          helm repo add valkey https://valkey.io/valkey-helm/
          helm dependency build helm/errand
          helm package helm/errand \
            --version "${TAG}" \
            --app-version "${TAG}"
          helm push "errand-${TAG}.tgz" "oci://${{ env.REGISTRY }}/${{ github.repository }}/charts"
