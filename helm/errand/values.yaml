server:
  replicaCount: 1
  image:
    repository: ghcr.io/errand-ai/errand
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8000
  maxConcurrentTasks: 3
  maxTurns: "200"

taskRunner:
  image:
    repository: ghcr.io/errand-ai/errand-task-runner
    tag: ""
    pullPolicy: IfNotPresent

playwright:
  enabled: true
  image:
    repository: mcr.microsoft.com/playwright/mcp
    tag: "latest"
    pullPolicy: IfNotPresent
  memoryLimit: "768Mi"
  port: 8931
  startupTimeout: 30

# Shared cloud workspace gateway (opt-in). When enabled, an errand-workspace
# component runs `rclone serve nfs` against a designated Google Drive or OneDrive
# folder and task Jobs whose profile opts in mount it at /shared.
#
# SECURITY / OPS TRADE-OFFS (read before enabling):
#   * Participating tasks share visibility of the mounted folder and their
#     writes persist across runs — the ephemeral-isolation guarantee is
#     deliberately relaxed for opted-in profiles. Use a dedicated workspace
#     folder (not the Drive/OneDrive root) so exposure is intentional.
#   * NFSv3 has no authentication; the NetworkPolicy below is what confines the
#     gateway to task-runner Jobs and the server. Keep it enabled.
#   * The cloud folder is the source of truth and is NOT backed up by errand —
#     rely on the provider's version history for recovery.
#   * SOLE WRITER: for any path tasks write, the cloud folder is gateway-owned. A
#     second sync client writing those paths concurrently (e.g. a human's native
#     Drive/OneDrive desktop client on the same folder) is UNSUPPORTED — it can
#     overwrite a gateway write-back or make the change-poll discard a local dirty
#     write. Scope the folder to gateway-owned content or exclude task-written
#     subpaths from other sync clients. See workspace-gateway/README.md.
#   * `service.clusterIP` MUST be a free static IP from the cluster's service
#     CIDR: kubelet mounts NFS from the node network where cluster DNS is
#     unavailable, so the PV targets the IP, not a DNS name. If unset, the
#     gateway Service gets a dynamic IP but the task PV cannot be templated.
#   * Every node that can schedule task Jobs MUST have an NFS client installed
#     (`nfs-utils` / `mount.nfs`); the kernel module alone is insufficient
#     (spike finding F2).
#   * Desktop (Apple) runtime parity requires the Drive/OneDrive client to be in
#     "mirrored" mode for the shared subfolder (File Provider dataless files do
#     not materialize reliably through virtiofs).
workspace:
  enabled: false
  provider: google_drive          # google_drive | onedrive (only differs in the rclone remote)
  folder: Errand                  # folder within the remote to serve (empty = remote root)
  remote: gdrive                  # rclone remote name defined inside configSecret
  configSecret: ""                # existing Secret with key `rclone.conf` (the authorized remote)
  # Operator-supplied opaque bearer the gateway refresher uses against the cloud
  # refresh endpoints. Registered server-side on startup; injected into the
  # refresher. Store it in a Secret (do NOT reuse mcp_api_key).
  bearerSecret: ""                # existing Secret name
  bearerKey: bearer               # key within bearerSecret
  pollInterval: "15s"
  service:
    clusterIP: ""                 # REQUIRED static ClusterIP (see notes above)
    port: 2049
  cache:
    size: 5Gi
    storageClass: ""              # empty = cluster default
    maxSize: 5G                   # rclone --vfs-cache-max-size
    # --- Write-back reliability (see the workspace-gateway-write-reliability change) ---
    # writeBack is rclone's --vfs-write-back: the delay after a file is last
    # modified before its data is uploaded. Set explicitly and SHORT (default 1s)
    # rather than relying on rclone's implicit 5s default — this bounds the window
    # in which a completed write can be lost before it reaches the cloud. Not 0s:
    # an immediate write-back per change is wasteful for large/streaming writes,
    # whereas 1s uploads promptly after the write-then-close pattern tasks use.
    #
    # NOTE (provider cadence): Google Drive and OneDrive have different change /
    # upload latencies, so writeBack (and workspace.pollInterval — see the F6
    # poll-interval cadence note) may warrant different values per provider.
    # Validate per provider; these defaults are tuned for Google Drive.
    writeBack: "1s"
    # Upload resilience. transfers = concurrent write-back uploads (--transfers).
    # lowLevelRetries / retries keep a transient provider error in a *retrying*
    # state (with backoff) instead of dropping the write — a dirty entry must
    # always be progressing toward upload, never silently stuck.
    transfers: 4
    lowLevelRetries: 10
    retries: 3
  # uid/gid every gateway container runs as. rclone creates its VFS cache dirs
  # mode 0700, so the refresher can only scan them for stuck dirty entries when
  # it shares this uid — a mismatch makes write-back stuck-entry detection
  # silently inert (the 2026-07-26 stall). Change only alongside the images.
  runAsUser: 65532
  # --- Write-back health (see the fix-workspace-gateway-sync-stalls change) ---
  writeBackHealth:
    # Upper bound on how long an entry may stay dirty, INDEPENDENT of the
    # close-triggered writeBack delay. NFSv3 has no CLOSE, so a task container
    # torn down mid-mount leaves its entry in-use forever and --vfs-write-back
    # never fires. Past this age an entry that was never queued is reported as
    # pinned by an open handle. 15 minutes is far above normal upload latency
    # while still bounding how long a stranded write can go unnoticed.
    maxDirtyAgeSeconds: 900
    # Opt-in, default OFF. Reporting is the required behaviour: a client may
    # still be writing a pinned entry, and publishing a torn file is the failure
    # this change exists to prevent. A stalled-but-reported write is recoverable
    # (see docs/workspace-gateway-runbook.md); a torn published write may not be.
    forceFlushPinned: false
    # Verify each completed upload's published size against the cached data that
    # was uploaded. Costs one rc operations/stat per upload; set false if that
    # proves costly on a high-volume workspace.
    verifyUploadSize: true
  # NFS PV/PVC that task Jobs mount (RWX). mountOptions carry the NFSv3 options,
  # which inline pod nfs: volumes cannot (spike finding F7).
  taskPvcName: errand-workspace
  nfsMountOptions:
    - nfsvers=3
    - nolock
    - soft
    - timeo=150
    - retrans=2
    # rclone serve nfs is TCP-only, but some NFS clients (e.g. the CentOS 7
    # kubelet) default NFSv3 to UDP and the mount then times out. Force TCP for
    # both the NFS and MOUNT protocols. (port=/mountport= are appended from
    # workspace.service.port by the PV template.)
    - proto=tcp
    - mountproto=tcp
  gateway:
    image:
      repository: ghcr.io/errand-ai/errand-workspace-gateway
      tag: ""
      pullPolicy: IfNotPresent
  refresher:
    image:
      repository: ghcr.io/errand-ai/errand-workspace-refresher
      tag: ""
      pullPolicy: IfNotPresent
    intervalSeconds: 3000         # ~50 min (tokens live ~60 min)
  networkPolicy:
    enabled: true
    # IMPORTANT: Kubernetes performs the NFS mount for the task Job's PVC from
    # the kubelet in the NODE network namespace, so the mount traffic originates
    # from the node IP — NOT the task-runner pod IP. A podSelector-only ingress
    # rule therefore blocks the mount when NetworkPolicy is enforced. List the
    # cluster's node (and/or pod) CIDRs here so the gateway accepts that traffic;
    # leave empty only if your CNI exempts node-originated traffic from policy.
    allowedCIDRs: []
    # - "10.0.0.0/8"      # example: node/pod CIDR

database:
  existingSecret: content-manager-db
  secretKey: DATABASE_URL

keycloak:
  existingSecret: content-manager-keycloak
  secretKeyClientId: OIDC_CLIENT_ID
  secretKeyClientSecret: OIDC_CLIENT_SECRET
  discoveryUrl: https://id.devops-consultants.net/auth/realms/devops-consultants/.well-known/openid-configuration
  rolesClaim: resource_access.errand.roles

# Cloud-trusted JWT validation. When the server receives an X-Cloud-JWT header
# (relayed from errand-cloud), it validates the token's `iss` claim against
# cloudKeycloakUrl before any JWKS fetch — pinning the trusted issuer closes
# an SSRF/token-forgery vector. Leave empty to disable cloud JWT auth;
# setting it opts in. Example: https://keycloak.example.com/realms/errand
cloudKeycloak:
  url: ""

llmProviders: []
  # - name: litellm
  #   baseUrl: "https://litellm.example.com/v1"
  #   apiKey: ""
  #   existingSecret: ""
  #   secretKeyApiKey: ""

valkey:
  enabled: true
  standalone:
    persistence:
      enabled: false
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

credentialEncryption:
  existingSecret: ""
  secretKey: CREDENTIAL_ENCRYPTION_KEY

# Deprecated: Twitter credentials are now managed via the platform UI.
# Kept for backwards compatibility with existing deployments.
twitter:
  existingSecret: ""

# Google Workspace OAuth client credentials. The previous gdrive-mcp deployment
# was removed in favour of the `gws` CLI bundled in the task-runner image, so
# only the OAuth secret reference remains here.
gdrive:
  existingSecret: ""

onedrive:
  enabled: true
  image:
    repository: ghcr.io/devops-consultants/one-drive-mcp-server
    tag: ""
    pullPolicy: IfNotPresent
  port: 8080
  existingSecret: ""

hindsight:
  url: ""
  bankId: "errand-tasks"
  # Optional bearer token for authenticated Hindsight deployments. When
  # `apiKey.secret` and `apiKey.key` are both set, the server Deployment
  # injects HINDSIGHT_TOKEN from `secretKeyRef`.
  apiKey:
    secret: ""
    key: ""

ingress:
  enabled: true
  host: tasks.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  tls:
    enabled: false
    secretName: ""
