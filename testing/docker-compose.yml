services:
  # pgvector rather than plain postgres: Hindsight now shares this database
  # (schema `hindsight`) and needs the `vector` extension, which init-db.sh
  # installs on first start. Switching image family invalidates an existing
  # postgres-data volume — `docker compose down -v` if an old one is present.
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: content_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - errand-net

  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - errand-net

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      secrets:
        - npm_token
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/content_manager
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - errand-net

  task-runner-build:
    build:
      context: ..
      dockerfile: task-runner/Dockerfile
    image: errand-task-runner:latest
    entrypoint: ["true"]

  errand:
    build:
      context: ..
      dockerfile: Dockerfile
      secrets:
        - npm_token
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    # A locally detected AI runtime is stored with the base URL that answered
    # the probe (http://host.docker.internal:11434/v1). The engine resolves
    # `host-gateway` to the real host on Docker Desktop and on Linux alike, so
    # one mapping serves both audiences.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/content_manager
      # OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL}
      # OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # OIDC_ROLES_CLAIM: resource_access.content-manager.roles
      # Trusted issuer for cloud-relayed JWTs (X-Cloud-JWT header). Must
      # match the cloud Keycloak realm URL exactly; set via .env to enable
      # cloud JWT auth locally. Leave unset for local-only dev.
      # CLOUD_KEYCLOAK_URL: ${CLOUD_KEYCLOAK_URL:-}
      VALKEY_URL: redis://valkey:6379
      CONTAINER_RUNTIME: docker
      TASK_RUNNER_IMAGE: errand-task-runner:latest
      TASK_RUNNER_NETWORK: errand-net
      ERRAND_MCP_URL: http://errand:8000/mcp/
      HINDSIGHT_URL: http://hindsight:8888
      # Must match HINDSIGHT_API_TENANT_API_KEY on the hindsight service, or
      # every memory call comes back 401.
      HINDSIGHT_TOKEN: ${HINDSIGHT_TOKEN:-errand-local-dev-token}
      PLAYWRIGHT_MCP_URL: http://playwright:3000/mcp
      LLM_PROVIDER_0_NAME: ${LLM_PROVIDER_0_NAME:-}
      LLM_PROVIDER_0_BASE_URL: ${LLM_PROVIDER_0_BASE_URL:-}
      LLM_PROVIDER_0_API_KEY: ${LLM_PROVIDER_0_API_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      TWITTER_API_KEY: ${TWITTER_API_KEY:-}
      TWITTER_API_SECRET: ${TWITTER_API_SECRET:-}
      TWITTER_ACCESS_TOKEN: ${TWITTER_ACCESS_TOKEN:-}
      TWITTER_ACCESS_SECRET: ${TWITTER_ACCESS_SECRET:-}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      MAX_TURNS: "200"
      ONEDRIVE_MCP_URL: http://onedrive-mcp:8080/mcp
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      # Shared workspace (opt-in). Empty by default → feature disabled, so a
      # plain `docker compose up` is unchanged. Set these in .env and start with
      # `--profile workspace` to enable the gateway locally.
      WORKSPACE_ENABLED: ${WORKSPACE_ENABLED:-}
      WORKSPACE_PROVIDER: ${WORKSPACE_PROVIDER:-google_drive}
      WORKSPACE_FOLDER: ${WORKSPACE_FOLDER:-Errand}
      WORKSPACE_VOLUME: ${WORKSPACE_VOLUME:-}
      WORKSPACE_BEARER: ${WORKSPACE_BEARER:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      task-runner-build:
        condition: service_completed_successfully
    networks:
      - errand-net

  onedrive-mcp:
    image: ghcr.io/devops-consultants/one-drive-mcp-server:latest
    ports:
      - "8082:8080"
    networks:
      - errand-net

  playwright:
    image: mcr.microsoft.com/playwright/mcp:latest
    entrypoint: ["sh", "-c"]
    command:
      - >-
        Xvfb :99 -screen 0 1920x1080x24 -ac -nolisten tcp &
        sleep 1 &&
        DISPLAY=:99 exec node /app/cli.js --browser chromium --no-sandbox
        --isolated --port 3000 --host 0.0.0.0 --allowed-hosts '*'
    shm_size: '2gb'
    ports:
      - "3000:3000"
    networks:
      - errand-net

  # --- Agent memory (Hindsight) ---
  # errand's own build: upstream's slim API image plus the packages the local
  # ONNX embedding path needs, with the embedding and reranker models baked in.
  # Built from source here so a compose run tests the Dockerfile in this repo
  # rather than whatever was last published.
  #
  # This replaces the standalone `hindsight` image, which ran its own embedded
  # PostgreSQL in /home/hindsight/.pg0. Memory now lives in the `hindsight`
  # schema of the same database errand uses, so there is no second database and
  # no embedded one — hence no hindsight-data volume.
  hindsight-build:
    build:
      context: ..
      dockerfile: Dockerfile.hindsight
    image: errand-hindsight:latest
    entrypoint: ["true"]

  hindsight-init:
    image: errand-hindsight:latest
    user: root
    volumes:
      - hindsight-models:/home/hindsight/.cache
    # Docker creates an empty named volume owned by root when the image has no
    # directory at the mount point, and Hindsight runs as uid 1000 — so without
    # this, first run dies on `PermissionError: /home/hindsight/.cache/huggingface`.
    command: chown -R hindsight:hindsight /home/hindsight/.cache
    depends_on:
      hindsight-build:
        condition: service_completed_successfully
    networks:
      - errand-net

  hindsight:
    image: errand-hindsight:latest
    # A locally detected AI runtime is stored with the base URL that answered
    # the probe (http://host.docker.internal:11434/v1). The engine resolves
    # `host-gateway` to the real host on Docker Desktop and on Linux alike, so
    # one mapping serves both audiences.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8888:8888"
    environment:
      # Same database as errand, different schema. Alembic owns `public` and
      # never touches `hindsight` (errand/tests/test_alembic_schema_boundary.py).
      HINDSIGHT_API_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/content_manager
      HINDSIGHT_API_DATABASE_SCHEMA: hindsight
      # Without a tenant extension the API and the MCP endpoint are both open.
      # The built-in API-key extension authenticates every endpoint except
      # /health, so the healthcheck below still works unauthenticated. The same
      # value reaches the errand server as HINDSIGHT_TOKEN.
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_TOKEN:-errand-local-dev-token}
      # Upstream warns at start-up that a worker id defaulting to the container
      # hostname changes on every recreate and can leave claimed work stuck.
      HINDSIGHT_API_WORKER_ID: hindsight
      HINDSIGHT_API_LLM_API_KEY: ${OPENAI_API_KEY}
      HINDSIGHT_API_LLM_BASE_URL: ${OPENAI_BASE_URL:-}
      # Overridable, and defaulted to a model that actually answers. The previous
      # hard-coded `claude-sonnet-4-5-20250929` fails on this proxy with
      # `BedrockException Invalid Authentication`, which surfaces only as a
      # fact-extraction error deep inside a retain. `minimax-m2.5:free` carries a
      # fallback chain, so it degrades to another free model rather than erroring.
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-minimax-m2.5:free}
    volumes:
      - hindsight-models:/home/hindsight/.cache
    depends_on:
      postgres:
        condition: service_healthy
      hindsight-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - errand-net

  # The Hindsight Control Plane: graph exploration, per-memory editing,
  # directives, webhooks. An expert debugging tool, so it is off by default and
  # publishes no port. Start it with:
  #   docker compose -f testing/docker-compose.yml --profile memory-ui up
  hindsight-control-plane:
    profiles: ["memory-ui"]
    image: ghcr.io/vectorize-io/hindsight-control-plane:0.9.2
    ports:
      - "9999:9999"
    environment:
      HINDSIGHT_CP_DATAPLANE_API_URL: http://hindsight:8888
      # The tenant extension closes the REST API too, not only /mcp, so the
      # Control Plane authenticates like any other client.
      HINDSIGHT_CP_DATAPLANE_API_KEY: ${HINDSIGHT_TOKEN:-errand-local-dev-token}
      # Its own login. Unset would mean no login at all on a UI with full
      # read/write access to every memory.
      HINDSIGHT_CP_ACCESS_KEY: ${HINDSIGHT_CP_ACCESS_KEY:-${HINDSIGHT_TOKEN:-errand-local-dev-token}}
    depends_on:
      hindsight:
        condition: service_healthy
    networks:
      - errand-net

  # --- Shared workspace gateway (opt-in; `docker compose --profile workspace up`) ---
  # Requires: an authorized rclone.conf at ${WORKSPACE_RCLONE_CONF:-./rclone.conf}
  # with a remote named ${WORKSPACE_REMOTE:-gdrive}, and a workspace bearer in
  # .env (WORKSPACE_BEARER) that the errand server registers on startup. Also set
  # WORKSPACE_ENABLED=true and WORKSPACE_VOLUME=workspace-shared in .env so the
  # errand server mounts the NFS volume into task containers.
  workspace-gateway:
    profiles: ["workspace"]
    # Restart-managed: rclone serve can exit under an error storm (design F1);
    # a crash must not leave /shared broken until a manual restart.
    restart: unless-stopped
    build:
      context: ../workspace-gateway
      dockerfile: Dockerfile.gateway
    environment:
      WORKSPACE_REMOTE: ${WORKSPACE_REMOTE:-gdrive}
      WORKSPACE_FOLDER: ${WORKSPACE_FOLDER:-Errand}
      WORKSPACE_POLL_INTERVAL: ${WORKSPACE_POLL_INTERVAL:-15s}
      WORKSPACE_ADDR: ":2049"
      WORKSPACE_RC_ADDR: "127.0.0.1:5572"
      WORKSPACE_CACHE_DIR: /cache
      # Write-back reliability (defaults match entrypoint.sh). VFS_WRITE_BACK is
      # shared with the refresher, which derives its stuck-entry grace period
      # from it — keep them in sync by setting the one env var.
      VFS_WRITE_BACK: ${VFS_WRITE_BACK:-1s}
      VFS_TRANSFERS: ${VFS_TRANSFERS:-4}
      LOW_LEVEL_RETRIES: ${LOW_LEVEL_RETRIES:-10}
      RETRIES: ${RETRIES:-3}
    # Publish the NFS port to the host: the `workspace-shared` volume below is
    # mounted by the Docker daemon on the HOST, which cannot resolve the
    # `workspace-gateway` service name nor reach an unpublished container port.
    # Bind to loopback only — NFSv3 has no authentication, so exposing it on all
    # host interfaces would let anything that can reach the host mount the share.
    ports:
      - "127.0.0.1:12049:2049"
    volumes:
      # The gateway runs as uid 65532 (it must share the refresher's identity to
      # make the VFS cache scannable), so this bind-mounted config must be
      # readable by that uid. `rclone config` writes 0600 owned by you, so run
      # `chmod 0644 rclone.conf` — otherwise the container exits 1 with an
      # explicit message rather than crash-looping silently.
      - ${WORKSPACE_RCLONE_CONF:-./rclone.conf}:/config-ro/rclone.conf:ro
      - workspace-cache:/cache
    networks:
      - errand-net

  workspace-refresher:
    profiles: ["workspace"]
    # Restart-managed so token rotation / health reporting resumes after a crash.
    restart: unless-stopped
    build:
      context: ../workspace-gateway
      dockerfile: Dockerfile.refresher
    # Share the gateway's network namespace so the private rc endpoint
    # (127.0.0.1:5572) is reachable and errand-net services still resolve.
    network_mode: "service:workspace-gateway"
    environment:
      ERRAND_API_URL: http://errand:8000
      ERRAND_WORKSPACE_BEARER: ${WORKSPACE_BEARER:-}
      WORKSPACE_PROVIDER: ${WORKSPACE_PROVIDER:-google_drive}
      WORKSPACE_REMOTE: ${WORKSPACE_REMOTE:-gdrive}
      RCLONE_RC_URL: http://127.0.0.1:5572
      REFRESH_INTERVAL_SECONDS: ${WORKSPACE_REFRESH_INTERVAL:-3000}
      # Write-back health: scan the same VFS cache (read-only) for stuck dirty
      # entries; grace period is derived from the gateway's write-back delay.
      # The scan only works because BOTH containers run as uid 65532 — rclone
      # creates its cache dirs mode 0700, so a uid mismatch makes detection
      # silently inert. If `cache_scan_selftest_failed` appears in the refresher
      # logs after upgrading, remove the pre-existing root-owned cache volume:
      #   docker compose -f testing/docker-compose.yml down
      #   docker volume rm testing_workspace-cache
      WORKSPACE_CACHE_DIR: /cache
      WORKSPACE_FOLDER: ${WORKSPACE_FOLDER:-Errand}
      VFS_WRITE_BACK: ${VFS_WRITE_BACK:-1s}
      # Bound on dirty age regardless of open-handle state (NFSv3 has no CLOSE),
      # post-upload size verification, and the (default-off) force-flush opt-in.
      MAX_DIRTY_AGE_SECONDS: ${MAX_DIRTY_AGE_SECONDS:-900}
      VERIFY_UPLOAD_SIZE: ${VERIFY_UPLOAD_SIZE:-true}
      FORCE_FLUSH_PINNED: ${FORCE_FLUSH_PINNED:-false}
    volumes:
      - workspace-cache:/cache:ro
    depends_on:
      - workspace-gateway

secrets:
  npm_token:
    environment: NPM_TOKEN

volumes:
  postgres-data:
  hindsight-models:
  # NFS-backed volume task containers mount at /shared (set WORKSPACE_VOLUME to
  # this name). The Docker host needs an NFS client (mount.nfs) available.
  workspace-cache:
  workspace-shared:
    driver: local
    driver_opts:
      type: nfs
      # Mounted by the host Docker daemon → target the published host port on
      # localhost (see the workspace-gateway `ports` mapping), not the
      # container-network service name.
      o: "addr=127.0.0.1,nolock,soft,vers=3,port=12049,mountport=12049,proto=tcp,mountproto=tcp"
      device: ":/"

networks:
  errand-net:
    name: errand-net
